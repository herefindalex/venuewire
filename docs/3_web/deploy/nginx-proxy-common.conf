# Include inside EACH proxy location used by the trading console.
# Suggested installed name: /etc/nginx/snippets/trading-console-proxy-common.conf
# This assumes one internet-facing Nginx edge, with no extra untrusted proxy hop.
# Replace example public host with WEB_PUBLIC_ORIGIN's actual authority.
proxy_http_version 1.1;
proxy_set_header Host trade.example.com;
proxy_set_header X-Forwarded-Host trade.example.com;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Port 443;
proxy_set_header X-Real-IP $remote_addr;
# Overwrite rather than append untrusted internet-supplied XFF.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header Forwarded "";
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $console_connection_upgrade;

proxy_connect_timeout 5s;
proxy_read_timeout 90s;
proxy_send_timeout 90s;
proxy_buffering off;
proxy_cache off;
# Never proxy-retry a potentially transmitted trade to another upstream.
proxy_next_upstream off;
client_max_body_size 64k;
