# Merge into the EXISTING HTTPS server {} for the console's public origin.
# Do not create competing server_name or certificate configuration.
# Replace 10.0.0.20:8080 with Go host B's actual private address.
# Replace include path with where nginx-proxy-common.conf was installed.

# Defense in depth. Go must also only serve explicitly embedded static assets.
location ~ (^|/)\.(?!well-known(?:/|$)) {
    return 404;
}
location ~* ^/(state|data|logs|secrets)(/|$) {
    return 404;
}

location = /api/ws {
    proxy_pass http://10.0.0.20:8080;
    include /etc/nginx/snippets/trading-console-proxy-common.conf;
}

location / {
    proxy_pass http://10.0.0.20:8080;
    include /etc/nginx/snippets/trading-console-proxy-common.conf;
}
